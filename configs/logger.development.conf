[loggers]
keys = root, requests

[handlers]
keys = stderr

[formatters]
keys = basic

[logger_root]
level = DEBUG
handlers = stderr
propagate = 1
qualname= root

[logger_requests]
level = WARNING
handlers = stderr
propagate = 1
qualname = requests

[handler_stderr]
class = StreamHandler
args = (sys.stderr, )
level = DEBUG
formatter = basic

[formatter_basic]
format = [%(asctime)s] %(levelname)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S
class = logging.Formatter

